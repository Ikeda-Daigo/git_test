name: actions_scriptのテスト

on:
  pull_request:
    types: [opened]
permissions:
  pull-requests: write
  contents: write
jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: SendComment
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "github actions botからのコメント"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
